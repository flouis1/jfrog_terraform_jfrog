## One entry per team — add yours here, terraform will loop over all of them.
## No code changes needed to onboard a new team.

- project_key: alpha
  display_name: "Team Alpha"
  description: "Frontend team"
  admin_groups:
    - alpha-leads
  member_groups:
    - alpha-devs
  repositories:
    - key: alpha-docker-dev-local
      type: local
      package_type: docker
      description: "Docker images — development"
      environments: ["DEV"]
    - key: alpha-docker-prod-local
      type: local
      package_type: docker
      description: "Docker images — production"
      environments: ["PROD"]
    - key: alpha-docker-remote
      type: remote
      package_type: docker
      description: "Proxy to Docker Hub"
      url: "https://registry-1.docker.io/"
      environments: ["DEV", "PROD"]
    - key: alpha-docker-virtual
      type: virtual
      package_type: docker
      description: "Single endpoint for all Docker repos"
      members:
        - alpha-docker-dev-local
        - alpha-docker-prod-local
        - alpha-docker-remote

