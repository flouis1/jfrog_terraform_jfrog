## One entry per team — add yours here, terraform will loop over all of them.
## No code changes needed to onboard a new team.

- project_key: team1
  display_name: "Team 1"
  description: "First team project"
  admin_groups:
    - team1-leads
  member_groups:
    - team1-devs
  repositories:
    - key: team1-docker-dev-local
      type: local
      package_type: docker
      description: "Docker images — development"
      environments: ["DEV"]
    - key: team1-docker-prod-local
      type: local
      package_type: docker
      description: "Docker images — production"
      environments: ["PROD"]
    - key: team1-docker-remote
      type: remote
      package_type: docker
      description: "Proxy to Docker Hub"
      url: "https://registry-1.docker.io/"
      environments: ["DEV", "PROD"]
    - key: team1-docker-virtual
      type: virtual
      package_type: docker
      description: "Single endpoint for all Docker repos"
      members:
        - team1-docker-dev-local
        - team1-docker-prod-local
        - team1-docker-remote

